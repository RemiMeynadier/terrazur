name: Rebuild terrace horizons

# Computes the sky horizon of every Paris terrace from the IGN LiDAR HD
# surface model (see scripts/build_horizons.py) and publishes the result on
# the `data` branch, which the app reads from raw.githubusercontent.com.
# Monthly: the City's terrace list changes; buildings and trees rarely do.
# The branch holds one force-pushed commit.

on:
  schedule:
    - cron: '17 3 2 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: horizons
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install numpy pillow
      - run: python scripts/build_horizons.py "$RUNNER_TEMP/out" --cache "$RUNNER_TEMP/cache"
      - run: python scripts/build_links.py "$RUNNER_TEMP/out"
      - name: Publish to the data branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/out"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Rebuild terrace horizons"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
